name: Build Multiplatform Release Artifacts

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - 'docs/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run KMP Unit Tests
        run: ./gradlew :shared-ui:jvmTest

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Android Release APK
        run: ./gradlew :app:assembleStableRelease

      - name: Prepare Android Artifacts
        run: |
          mkdir -p build-outputs/android
          cp app/build/outputs/apk/stable/release/*.apk build-outputs/android/cloudstream-stable-arm64-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-android-apk
          path: build-outputs/android/*.apk
          retention-days: 14

  build-linux:
    name: Build Linux Desktop (Deb & Distributable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Linux Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev libvlc-dev vlc

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Linux Desktop Distributable & Deb
        run: ./gradlew :desktop:createDistributable :desktop:packageDeb

      - name: Package Linux Standalone Bundle & Deb
        run: |
          mkdir -p build-outputs/linux
          if compgen -G "desktop/build/compose/binaries/main/deb/*.deb" > /dev/null; then
            cp desktop/build/compose/binaries/main/deb/*.deb build-outputs/linux/
          fi
          tar -czf build-outputs/linux/cloudstream-linux-x64-portable.tar.gz -C desktop/build/compose/binaries/main/app .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-linux-desktop
          path: build-outputs/linux/*
          retention-days: 14
